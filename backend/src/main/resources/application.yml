spring:
  application:
    name: serialized-coupon
  profiles:
    default: local
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    encoding: UTF-8
  mvc:
    problemdetails:
      enabled: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://serializedcoupon.up.railway.app,https://serializedcoupon-production.up.railway.app}
  rms:
    client: ${RMS_CLIENT:mock}
    base-url: ${RMS_BASE_URL:}
    api-key: ${RMS_API_KEY:}
  coupon:
    generation:
      max-batch-size: ${COUPON_MAX_BATCH_SIZE:10000}
      min-batch-size: 1
      collision-retry-limit: ${COUPON_COLLISION_RETRY_LIMIT:20}
      persistence-chunk-size: ${COUPON_PERSISTENCE_CHUNK_SIZE:100}
      sample-size: 25
    validation:
      require-live-rms-active: ${COUPON_REQUIRE_LIVE_RMS:true}
    export:
      csv-filename-prefix: serialized-coupons
