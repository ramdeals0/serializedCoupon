spring:
  datasource:
    url: jdbc:h2:file:./data/serialized-coupon;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  rms:
    client: mock

logging:
  level:
    com.skillnet.serializedcoupon: INFO
    org.hibernate.SQL: WARN
