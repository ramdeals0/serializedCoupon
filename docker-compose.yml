services:
  postgres:
    image: postgres:16-alpine
    container_name: serialized-coupon-postgres
    environment:
      POSTGRES_DB: serialized_coupon
      POSTGRES_USER: ${POSTGRES_USER:-coupon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coupon}
    ports:
      - "5432:5432"
    volumes:
      - serialized_coupon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coupon} -d serialized_coupon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  serialized_coupon_pgdata:
